<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the bus name -->
  <policy user="root">
    <allow own="com.verde.Manager"/>
  </policy>

  <policy context="default">
    <!-- Allow sending to the Verde Manager interface (Polkit gates execution) -->
    <allow send_destination="com.verde.Manager"
           send_interface="com.verde.Manager"/>
    <!-- Allow property reads -->
    <allow send_destination="com.verde.Manager"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="com.verde.Manager"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <!-- Deny property writes — all daemon properties are read-only -->
    <deny send_destination="com.verde.Manager"
          send_interface="org.freedesktop.DBus.Properties"
          send_member="Set"/>
    <!-- Allow introspection for tooling compatibility -->
    <allow send_destination="com.verde.Manager"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            blueprint-compiler \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            meson \
            ninja-build \
            gettext \
            desktop-file-utils \
            appstream \
            python3-pip

      - name: Install Python tools
        run: pip install --break-system-packages ruff mypy pytest

      - name: Meson setup
        run: meson setup builddir

      - name: Meson compile
        run: meson compile -C builddir

      - name: Meson test (desktop-file, appstream validation)
        run: meson test -C builddir --print-errorlogs

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Type check (mypy)
        run: |
          mypy src/verde/ --ignore-missing-imports
          cd src/verde-daemon && mypy *.py --ignore-missing-imports --follow-imports=skip

      - name: Unit tests
        run: pytest tests/unit/ -v

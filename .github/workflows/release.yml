name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches meson version
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          MESON_VER=$(grep "version:" meson.build | head -1 | sed "s/.*version: '\\(.*\\)'.*/\\1/")
          if [ "$TAG_VER" != "$MESON_VER" ]; then
            echo "ERROR: Tag version ($TAG_VER) != meson.build version ($MESON_VER)"
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev blueprint-compiler \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            meson ninja-build gettext desktop-file-utils appstream \
            python3-pip xvfb debhelper devscripts lintian

      - name: Install Python tools
        run: pip install --break-system-packages pytest

      - name: Run full test suite
        run: |
          meson setup builddir && meson compile -C builddir
          PYTHONPATH=src:src/verde-daemon xvfb-run pytest tests/ -v

      - name: Build .deb package
        run: debuild -us -uc -b

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ../*.deb
          generate_release_notes: true
